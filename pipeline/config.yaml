# MounTour trip pipeline settings. Edit freely; the weekly job reads this file.
# Distances in metres, times in minutes, boxes as [west, south, east, north].

regions:
  - id: tatry
    name: Tatry
    protected_area: TANAP
    bboxes: [[19.45, 49.07, 20.40, 49.32]]
    max_trips: 30
  - id: slovensky-raj
    name: Slovenský raj
    protected_area: NP Slovenský raj
    bboxes: [[20.15, 48.86, 20.60, 48.99]]
    max_trips: 12
  - id: mala-fatra
    name: Malá Fatra
    protected_area: NP Malá Fatra
    bboxes: [[18.95, 49.13, 19.17, 49.26], [18.68, 48.98, 18.92, 49.14]]
    max_trips: 15
  - id: male-karpaty
    name: Malé Karpaty
    protected_area: CHKO Malé Karpaty
    bboxes: [[16.95, 48.14, 17.80, 48.76]]
    max_trips: 12

trips:
  # a trailhead is a KST guidepost with public parking or a stop nearby
  parking_max_m: 800
  bus_stop_max_m: 1000
  train_max_m: 2000
  trailhead_needs_stop_max_m: 500
  # destination must sit this close to a marked trail
  destination_snap_m: 150
  # walk limits
  min_round_trip_m: 2000
  max_duration_min: 540
  min_marked_share: 0.6
  # two destinations closer than this count as one (e.g. a hut at a tarn)
  dedupe_m: 400
  # keep at least this many family trips per region when the region has them
  min_family_per_region: 5
  # variety: at most this many trips from one start
  max_trips_per_start: 3
  # generated trips need some climb, so city sights don't count as trips (tarns, waterfalls, caves excepted)
  min_ascent_m: 80
  # a parking must sit this close to a public car road (checked with OSRM; drops hotel-only roads)
  parking_road_max_m: 150
  # guideposts never used as a start (by exact name)
  exclude_starts: []
  poi_max_m: 150

# Hand-picked trips, always built. They are also the regression test set: the
# pipeline report compares them with `expect` and flags anything off by > 15 %.
pinned:
  - slug: devinska-kobyla
    name: "Devínska Kobyla z Devína"
    start: {name: "Devín, pod hradom", lat: 48.17547, lon: 16.97993}
    destination: {name: "Devínska Kobyla, rozhľadňa", lat: 48.18937, lon: 16.99553}
    kind: vyhliadka
    description: "Výstup z Devína pod hradom na najvyšší vrch Devínskych Karpát s rozhľadňou. Výhľad na sútok Moravy a Dunaja."
    # values from the hand-built 2026-10-07 version (BRouter), the regression baseline
    expect: {distance_m: 6836, ascent_m: 370, duration_min: 180}
