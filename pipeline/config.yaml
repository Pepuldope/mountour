trips:
  # a trailhead is a KST guidepost with public parking or a stop nearby
  parking_max_m: 800
  bus_stop_max_m: 1000
  train_max_m: 2000
  trailhead_needs_stop_max_m: 500
  # destination must sit this close to a marked trail
  destination_snap_m: 150
  # walk limits
  min_round_trip_m: 2000
  max_duration_min: 540
  min_marked_share: 0.6
  # two destinations closer than this count as one (e.g. a hut at a tarn)
  dedupe_m: 400
  # keep at least this many family trips per region when the region has them (only matters with max_trips)
  min_family_per_region: 5
  # variety: at most this many trips from one start
  max_trips_per_start: 8
  # several marked routes lead to most places: keep the main one plus up to two others
  # (the main one = the best-known start: big car park, stop, food, trail hub, village)
  max_routes_per_destination: 3
  # two routes are the same route when they share more than this part of the shorter one
  route_overlap_max: 0.5
  # trailheads tried per destination, nearest first
  route_trailheads_max: 25
  # generated trips need some climb, so city sights don't count as trips (tarns, waterfalls, caves excepted)
  min_ascent_m: 80
  # a parking must sit this close to a public car road (checked with OSRM; drops hotel-only roads)
  parking_road_max_m: 150
  # guideposts never used as a start (by exact name): hotel-only roads OSRM still treats as public
  exclude_starts: ["Sliezsky dom"]
  poi_max_m: 150

