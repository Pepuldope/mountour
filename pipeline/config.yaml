# Hand-picked trips, always built. They are also the regression test set: the
# pipeline report compares them with `expect` and flags anything off by > 15 %.
pinned:
  - slug: devinska-kobyla
    name: "Devínska Kobyla z Devína"
    start: {name: "Devín, pod hradom", lat: 48.17547, lon: 16.97993}
    destination: {name: "Devínska Kobyla, rozhľadňa", lat: 48.18937, lon: 16.99553}
    kind: vyhliadka
    description: "Výstup z Devína pod hradom na najvyšší vrch Devínskych Karpát s rozhľadňou. Výhľad na sútok Moravy a Dunaja."
    # values from the hand-built 2026-10-07 version (BRouter), the regression baseline
    expect: {distance_m: 6836, ascent_m: 370, duration_min: 180}
  - slug: kamzik
    name: "Kamzík zo Železnej studničky"
    # Most people walk up from the car park on the far side (Koliba); this route stays as another way up.
    # That walk is short and nearly flat, so this place accepts shorter routes than the defaults.
    main: auto
    route_limits: {min_round_trip_m: 1000, min_ascent_m: 30}
    start: {name: "Železná studnička", lat: 48.19031, lon: 17.08224}
    destination: {name: "Kamzík", lat: 48.18185, lon: 17.09337}
    kind: vrchol
    description: "Krátky výstup lesom zo Železnej studničky na Kamzík k televíznej veži. Na vrchole bufety a lesný park."
    # values from the hand-built 2026-10-07 version (BRouter), the regression baseline
    expect: {distance_m: 5124, ascent_m: 231, duration_min: 120}
