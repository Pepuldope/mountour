name: Explore goals (temporary)
on:
  push:
    branches: ["claude/trail-quality-**"]
    paths: ["pipeline/explore_goals.py", ".github/workflows/explore-goals.yml"]
jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install osmium
      - run: curl -fsSL --retry 3 -o sk.osm.pbf https://download.geofabrik.de/europe/slovakia-latest.osm.pbf
      - run: python pipeline/explore_goals.py sk.osm.pbf > explore.txt; head -c 60000 explore.txt
      - run: grep -iE "janos|jánoš|suchá belá|prielom|sokolia|kláštor|súľov|piecky|kyseľ|tomášov|zejmar|vihorlat|kvačian|prosieck" explore.txt | head -200
