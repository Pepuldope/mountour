name: Monthly report

# The month's usage numbers (scripts/monthly_report.py): the site's own counters
# in D1 (people, visit days, plan actions), as JSON and a table in the run's
# summary. Also the monthly backup of those totals, the only D1 data not rebuilt
# from this repository: the month's JSON (totals only, no visitor data) is
# committed to reports/, since a run's files are deleted after 90 days.
# Reads D1 only: nothing is written there. Runs on the 1st for the month
# before, or by hand from the Actions tab for any month.
on:
  schedule:
    - cron: "17 4 1 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Month as YYYY-MM (empty = last month)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      CF_READY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      DB: mountour-visits
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        if: env.CF_READY == 'true'
        with:
          node-version: 22
          cache: npm
      - if: env.CF_READY == 'true'
        run: npm ci --ignore-scripts

      # Finished months from visit_month, the running month from its raw rows (same sums as
      # lib/visitStore.ts). Totals only: no visitor hashes or salts leave the database.
      - name: Read the counters
        if: env.CF_READY == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p build
          npx wrangler d1 execute "$DB" --remote --json --command "
            SELECT month, visitors, visitors_2plus_days, visitors_4plus_days, avg_days FROM visit_month;
            SELECT month, COUNT(*) AS visitors, SUM(days >= 2) AS visitors_2plus_days,
                   SUM(days >= 4) AS visitors_4plus_days, ROUND(AVG(days), 2) AS avg_days
            FROM (SELECT substr(day, 1, 7) AS month, visitor, COUNT(*) AS days FROM visit_day GROUP BY 1, 2)
            GROUP BY month" > build/visits.json
          npx wrangler d1 execute "$DB" --remote --json \
            --command "SELECT month, name, detail, n FROM event_month" > build/events.json
          # Review totals per trip (no notes, no reviewer ids: reports/ is public). The table appears with the first review.
          npx wrangler d1 execute "$DB" --remote --json --command "
            SELECT slug, COUNT(*) AS n, ROUND(AVG(stars), 2) AS stars, SUM(fit = 'popis') AS popis, SUM(fit = 'tazsie') AS tazsie,
                   SUM(fit = 'lahsie') AS lahsie, SUM(crowded = 1) AS crowded, SUM(timing = 'sedeli') AS times_held,
                   SUM(timing = 'dlhsie') AS took_longer, SUM(timing = 'kratsie') AS took_shorter FROM review GROUP BY slug" > build/reviews.json || echo '[]' > build/reviews.json

      - name: Make the report
        env:
          MONTH: ${{ inputs.month }}
        run: |
          if [ -n "$MONTH" ] && ! [[ "$MONTH" =~ ^[0-9]{4}-[0-9]{2}$ ]]; then echo "month must be YYYY-MM"; exit 1; fi
          python scripts/monthly_report.py --month "$MONTH" --visits build/visits.json --events build/events.json --out build/report

      - name: Keep the totals in reports/
        if: env.CF_READY == 'true'
        run: |
          mkdir -p reports
          cp build/report/*.json reports/
          cp build/reviews.json reports/reviews.json
          git config user.name "turuj-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "Monthly usage totals"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 5))
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: build/report/
          retention-days: 90
