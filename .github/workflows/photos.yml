name: Place photos

# Free photos for the places trips lead to (pipeline/photos.py), from Wikimedia
# Commons. Runs after the Monday trip data and commits public/data/photos.json.
on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: photos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pipeline.photos
      - name: Commit the photo list
        run: |
          git config user.name "mountour-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp public/data/photos.json "$RUNNER_TEMP/photos.json"
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git checkout -f --detach "origin/${GITHUB_REF_NAME}"
            cp "$RUNNER_TEMP/photos.json" public/data/photos.json
            git add public/data/photos.json
            if git diff --cached --quiet; then echo "No changes."; exit 0; fi
            git commit -m "Place photos from Wikimedia Commons"
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 5))
          done
          exit 1
