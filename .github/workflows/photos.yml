name: Place photos

# Free photos for the places trips lead to (pipeline/photos.py), from Wikimedia
# Commons. Runs when the weekly trip data is done (so new places get photos the
# same day, however late GitHub starts that run) and commits public/data/photos.json.
# pipeline/photos.py keeps the old file when far fewer photos come back (a bad
# hour at Commons), and the site's tests run before the commit.
on:
  workflow_run:
    workflows: ["Weekly trip data"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: photos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  photos:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: python -m pipeline.photos
      # The site reads photos.json on the server: check it (size budget, shape) before it ships.
      - run: npm ci --ignore-scripts
      - run: npx vitest run lib/assetBudget.test.ts
      - name: Commit the photo list
        run: |
          git config user.name "turuj-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp public/data/photos.json "$RUNNER_TEMP/photos.json"
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git checkout -f --detach "origin/${GITHUB_REF_NAME}"
            cp "$RUNNER_TEMP/photos.json" public/data/photos.json
            git add public/data/photos.json
            if git diff --cached --quiet; then echo "No changes."; exit 0; fi
            git commit -m "Place photos from Wikimedia Commons"
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 5))
          done
          exit 1
