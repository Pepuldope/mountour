name: Weekly trip data

# Rebuilds the trips from OpenStreetMap (pipeline/, docs/TRIP-DATA.md) every
# Monday and commits the result, which redeploys the site. Run it by hand from
# the Actions tab ("Run workflow") after editing pipeline/config.yaml or the rules.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  push:
    branches: ["claude/osm-trip-pipeline-**", "claude/site-fixes-and-features-**", "claude/import-all-trails-**", "claude/trail-quality-**"]
    paths: ["pipeline/**", ".github/workflows/trips.yml"]
  pull_request:
    paths: ["pipeline/**", ".github/workflows/trips.yml"]

permissions:
  contents: write

concurrency:
  group: trips-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - run: python -m pytest -q pipeline/tests

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OSRM_IMAGE: ghcr.io/project-osrm/osrm-backend:v5.27.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      # The database tests check the committed data, which this job is about to replace.
      - run: python -m pytest -q pipeline/tests --ignore=pipeline/tests/test_db.py

      - name: Download OpenStreetMap extract (Geofabrik, Slovakia)
        run: |
          mkdir -p osrm
          curl -fsSL --retry 3 -o osrm/slovakia.osm.pbf https://download.geofabrik.de/europe/slovakia-latest.osm.pbf
          ls -la osrm
          TS=$(python -c "import osmium; r = osmium.io.Reader('osrm/slovakia.osm.pbf', osmium.osm.NOTHING); print(r.header().get('osmosis_replication_timestamp', '')); r.close()")
          echo "OSM_TS=$TS" >> "$GITHUB_ENV"
          echo "OSM data timestamp: $TS"

      - name: Cache elevation tiles
        uses: actions/cache@v4
        with:
          path: pipeline/.cache/dem
          key: dem-v1-${{ hashFiles('pipeline/config.yaml') }}
          restore-keys: dem-v1-
      - name: Download elevation tiles (Copernicus DEM GLO-30)
        run: python -m pipeline.dem pipeline/.cache/dem

      - name: Start OSRM for drive times
        run: |
          docker run --rm -v "$PWD/osrm:/data" "$OSRM_IMAGE" osrm-extract -p /opt/car.lua /data/slovakia.osm.pbf
          docker run --rm -v "$PWD/osrm:/data" "$OSRM_IMAGE" osrm-partition /data/slovakia.osrm
          docker run --rm -v "$PWD/osrm:/data" "$OSRM_IMAGE" osrm-customize /data/slovakia.osrm
          docker run -d --name osrm -p 5000:5000 -v "$PWD/osrm:/data" "$OSRM_IMAGE" \
            osrm-routed --algorithm mld --max-table-size 5000 /data/slovakia.osrm
          for i in $(seq 1 60); do
            curl -sf "http://localhost:5000/route/v1/driving/17.107,48.148;19.146,48.736" >/dev/null && break
            sleep 2
          done
          curl -sf "http://localhost:5000/route/v1/driving/17.107,48.148;19.146,48.736" | head -c 300; echo

      # The walks from parking spots and stops to the trail (pipeline/walks.py): worked out here
      # once a week, so the trip page doesn't ask a rate-limited router on every visit.
      - name: Start OSRM for walks to the trail
        run: |
          mkdir -p osrm-foot && cp osrm/slovakia.osm.pbf osrm-foot/
          docker run --rm -v "$PWD/osrm-foot:/data" "$OSRM_IMAGE" osrm-extract -p /opt/foot.lua /data/slovakia.osm.pbf
          docker run --rm -v "$PWD/osrm-foot:/data" "$OSRM_IMAGE" osrm-partition /data/slovakia.osrm
          docker run --rm -v "$PWD/osrm-foot:/data" "$OSRM_IMAGE" osrm-customize /data/slovakia.osrm
          docker run -d --name osrm-foot -p 5001:5000 -v "$PWD/osrm-foot:/data" "$OSRM_IMAGE" \
            osrm-routed --algorithm mld /data/slovakia.osrm
          for i in $(seq 1 60); do
            curl -sf "http://localhost:5001/route/v1/foot/17.107,48.148;17.11,48.15" >/dev/null && break
            sleep 2
          done
          curl -sf "http://localhost:5001/route/v1/foot/17.107,48.148;17.11,48.15" | head -c 300; echo

      - name: Build trips
        run: |
          python -m pipeline.run --pbf osrm/slovakia.osm.pbf --dem pipeline/.cache/dem \
            --osrm http://localhost:5000 --osrm-foot http://localhost:5001 --wikidata --osm-timestamp "$OSM_TS"
          cat data/pipeline-report.md >> "$GITHUB_STEP_SUMMARY"

      # Error 1102 guard (lib/assetBudget.test.ts has the same limits): the Worker parses these
      # files on requests; too big and it runs out of CPU. Keep last week's data rather than ship that.
      - name: Check the files the site reads stay small
        run: |
          python - <<'PY'
          import pathlib, sys
          d = pathlib.Path("public/data")
          big = [(p, p.stat().st_size) for p in [*d.glob("trips/*.json"), *d.glob("drive/*.json")]
                 if p.stat().st_size > (2.5 * 2**20 if p.name in ("index.json", "list.json") else 200 * 2**10)]
          for p, n in big:
              print(f"::error::{p} is {n / 2**20:.2f} MB, over the Worker's budget")
          sys.exit(1 if big else 0)
          PY

      # Two places under one name (two "Kriváň" in different mountains) must never reach the site.
      - name: Check trip names
        run: python -m pipeline.names --check public/data/trips/list.json

      - name: Commit the new data
        run: |
          git config user.name "mountour-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Lay the fresh files on top of the branch as it is now, so a newer
          # data commit or code push never conflicts: the new build replaces it.
          OUT="public/data/trips public/data/drive public/data/map public/data/search.json data/towns.json data/trip-variants.json data/pipeline-report.md public/gpx pipeline/slugs.json"
          for attempt in 1 2 3; do
            rm -rf "$RUNNER_TEMP/out" && mkdir -p "$RUNNER_TEMP/out"
            tar cf "$RUNNER_TEMP/out/new.tar" $OUT
            git fetch origin "${GITHUB_REF_NAME}"
            git checkout -f --detach "origin/${GITHUB_REF_NAME}"
            rm -rf public/data/trips public/data/drive public/data/map public/gpx && tar xf "$RUNNER_TEMP/out/new.tar"
            git add -A $OUT
            if git diff --cached --quiet; then
              echo "No changes."
              exit 0
            fi
            git commit -m "Trip data from OpenStreetMap ${OSM_TS:-}"
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 5))
          done
          exit 1
