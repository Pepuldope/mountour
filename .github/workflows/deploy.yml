name: Deploy

# Publishes main to the Cloudflare Worker "turuj" from GitHub's free runners.
# Cloudflare's own Workers Builds stopped for the month on 2026-10-25 when the free
# 3,000 build minutes ran out; a public repo's Actions minutes are free and unlimited.
# Needs repo secrets CLOUDFLARE_DEPLOY_TOKEN (template "Edit Cloudflare Workers") and
# CLOUDFLARE_ACCOUNT_ID; without them it only says so and stops.

on:
  push:
    branches: [main]
  # The data workflows push to main with GITHUB_TOKEN, which starts no push event,
  # so deploy after each of them instead.
  workflow_run:
    workflows: [Place photos, Weekly trip data, Weekly trail map, Weekly train timetable, Monthly report]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      CF_READY: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - if: env.CF_READY != 'true'
        run: echo "::notice::CLOUDFLARE_DEPLOY_TOKEN or CLOUDFLARE_ACCOUNT_ID secret not set; nothing deployed."
      # The build writes ~10 GB (.next and .open-next, both languages); the runner starts
      # with less free than that, so drop preinstalled SDKs this job never uses.
      - if: env.CF_READY == 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - if: env.CF_READY == 'true'
        uses: actions/checkout@v7
      - if: env.CF_READY == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - if: env.CF_READY == 'true'
        run: npm ci
      # Same commands as Workers Builds. WORKERS_CI_COMMIT_SHA gives the build its
      # deployment id (next.config.ts), so open tabs reload after a deploy.
      - if: env.CF_READY == 'true'
        run: npx opennextjs-cloudflare build
        env:
          WORKERS_CI_COMMIT_SHA: ${{ github.sha }}
      # Cloudflare's asset upload sometimes answers "unknown error [code: 10013]"; a second try passes.
      - if: env.CF_READY == 'true'
        run: npx opennextjs-cloudflare deploy || (sleep 60 && npx opennextjs-cloudflare deploy)
        env:
          WORKERS_CI_COMMIT_SHA: ${{ github.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
