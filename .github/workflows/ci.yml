name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Runs `next build` and bundles the Cloudflare Worker (OpenNext).
      - run: npm run cf:build
      # Every page is built ahead or kept after its first visit, never drawn per visit (error 1102).
      - run: node scripts/check-page-cache.mjs

  # The trip pipeline's tests (pipeline/tests): the trips workflow runs them only when the
  # pipeline changes, but the site's data and the database load depend on them too.
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - run: python -m pytest -q pipeline/tests
