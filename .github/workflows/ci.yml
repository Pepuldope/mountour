name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Runs `next build` and bundles the Cloudflare Worker (OpenNext).
      - run: npm run cf:build
      # Every page is built ahead or kept after its first visit, never drawn per visit (error 1102).
      - run: node scripts/check-page-cache.mjs
