# Temporary: checks the national rail GTFS download from GitHub's network. Removed before merge.
name: GTFS probe
on:
  push:
    branches: ["claude/project-thread-1upsgq"]
    paths: [".github/workflows/gtfs-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Download and summarize
        run: |
          set -x
          for u in "https://data.slovensko.sk/download?id=c4918871-2860-4e6f-bf67-55e5c902785d" "https://www.zsr.sk/files/pre-cestujucich/cestovny-poriadok/gtfs/gtfs.zip"; do
            echo "=== $u"
            curl -sSL -m 120 -D - -o g.zip "$u" | grep -iE "^HTTP|content-(length|type|disposition)|last-modified" || true
            ls -la g.zip || true
            if unzip -l g.zip; then
              mkdir -p x && unzip -o -q g.zip -d x
              for f in x/*.txt; do echo "--- $f $(wc -l < $f) lines"; head -3 "$f"; done
              cut -d, -f1-3 x/calendar.txt 2>/dev/null | head -2
              awk -F, 'NR>1{print $9" "$10}' x/calendar.txt 2>/dev/null | sort | uniq -c | sort -rn | head -5
              cat x/feed_info.txt 2>/dev/null
              cat x/agency.txt
              grep -i -E "skalit|strba|štrba|vrútky|tatranská|poprad" x/stops.txt | head -10
            fi
            rm -rf x g.zip
          done
