name: Trip database

# Loads the trips into the site's Cloudflare D1 database (pipeline/db.py), which
# /api/vylety and the trip pages read. Runs after every weekly trip refresh,
# whenever trip data reaches main, and by hand from the Actions tab. Until the
# CLOUDFLARE_API_TOKEN secret exists it only builds and checks the SQL; the
# site then keeps serving the static files in data/, exactly as before.
on:
  workflow_run:
    workflows: ["Weekly trip data"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    # Data only: a change to the loader itself loads with the next data change (or by hand),
    # so merging loader code never spends a day's D1 writes on its own.
    paths: ["data/**", "public/data/trips/**", "public/data/drive/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trip-database
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    env:
      # Whether the Cloudflare secrets exist; the token itself is handed only to the steps that
      # run wrangler, never to package installs (whose install scripts could read it).
      CF_READY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      DB: mountour-visits
    steps:
      # The weekly run commits to main; take main as it is now, not the commit that started it.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q pipeline/tests/test_db.py
      - run: python -m pipeline.db --out build/db.sql

      - name: Skip without Cloudflare access
        if: env.CF_READY != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID secret not set; the site keeps using the static files."

      - uses: actions/setup-node@v4
        if: env.CF_READY == 'true'
        with:
          node-version: 22
          cache: npm
      - if: env.CF_READY == 'true'
        run: npm ci --ignore-scripts

      # D1's free plan writes 100k rows a day and a full load of ~5,000 trips writes about 55k: skip
      # loads the database already holds, and otherwise write only what changed (below).
      - name: Compare with the loaded data
        id: loaded
        if: env.CF_READY == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          want=$(python -m pipeline.db --fingerprint)
          have=$(npx wrangler d1 execute "$DB" --remote --json \
            --command "SELECT fingerprint FROM data_version WHERE id = 1" 2>/dev/null \
            | python -c "import json,sys; print(json.load(sys.stdin)[0]['results'][0]['fingerprint'])" 2>/dev/null || true)
          echo "want=$want have=${have:-none}"
          if [ "$want" = "$have" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "same=true" >> "$GITHUB_OUTPUT"
            echo "::notice::The database already holds this data ($want)."
          fi

      # The trips' hashes and the shared rows the database holds now; pipeline/db.py then writes
      # only changed trips and rows. Unreadable or an older schema: a full load.
      - name: Write only what changed
        if: env.CF_READY == 'true' && steps.loaded.outputs.same != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute "$DB" --remote --json --command "$(python -m pipeline.db --have-sql)" \
            > build/have.json 2>/dev/null || rm -f build/have.json
          python -m pipeline.db --have build/have.json --out build/db.sql --parts build/parts

      - name: Load into D1
        if: env.CF_READY == 'true' && steps.loaded.outputs.same != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # In parts: one big file runs out of D1's CPU time. Each part is all-or-nothing; the
          # version row is in the last one, so until then the site reads the static files.
          for part in build/parts/part-*.sql; do
            echo "loading $part ($(wc -c < "$part") bytes)"
            for attempt in 1 2 3; do
              npx wrangler d1 execute "$DB" --remote --file "$part" -y && break
              [ "$attempt" = 3 ] && exit 1
              sleep $((attempt * 20))
            done
          done
          npx wrangler d1 execute "$DB" --remote --json \
            --command "SELECT generated_at, trips, fingerprint FROM data_version"
