# Keeps the GitHub Actions in the workflows up to date (they run on a Node runtime GitHub is
# retiring). npm packages are left to hand upgrades: next is pinned for OpenNext.
# One grouped pull request a month: every branch push also queues a Cloudflare build, and
# Cloudflare builds one at a time, so separate PRs held up deploys of main (2026-10-17).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
